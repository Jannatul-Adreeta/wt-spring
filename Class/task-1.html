<!DOCTYPE html>

<html>

<head><title>

    AIUB admission

</title></head>




<body>


    <style>
        body{ 
            background-color: rgb(169, 138, 138);
             
        }

        table{
            margin-top: 2px;
            border: 2px dashed rgb(0, 0, 0);
            padding: 40px;
            color: rgb(0, 0, 1);
            background-color: rgb(218, 219, 222);
            margin-bottom: 5px;
            margin-left: auto;
            margin-right: auto;
            font-size: 25px;
            border-radius: 15px;

        }

        .box{ 
            width: 300px;
            height: 30px;
            border: 2px  dotted rgb(65, 63, 63);
            border-radius: 5px;
            

        }

        .box1{
            width: 500px;
            height: 40px;
            color: rgb(255, 255, 255);
            background-color: rgb(130, 69, 51);
            border-style: dashed;
            font-size: large;

            

        }

       


    </style>


 

<h1>AIUB Admission Registration Form Page</h1>


   

<form>

    <table>

        <tr>

            <td>First Name: </td>

            <td> <input type="text" class="box"> </td>

        </tr>

        <tr>

            <td>Last Name: </td>

            <td> <input type="text" class="box"> </td>

        </tr>

        <tr>

            <td>Email Address: </td>

            <td><input type="email" class="box">  </td>

        </tr>

         <tr>

            <td>Ethnicity: </td>

            <td><input type="checkbox" id="Ethnicity" name="Ethnicity" value="Bangladeshi"> Bangladeshi <input type="checkbox" id="Ethnicity1" name="Ethnicity1" value="Others"> Others </td>

        </tr>

        <tr>

            <td>Gender: </td>

            <td> <input type="radio",name="Gender" , value="Male"> Male 
            <input type="radio", name="Gender", value="Female"> Female </td>

        </tr> 

      
        <tr>

            <td>Date of Birth: </td>

            <td> <input type="date" class="box"></td>

        </tr>

         <tr>

            <td>Credentials: </td>

            <td> <input type="file"></td>

        </tr>

         <tr>

            <td>Photo:</td>
            <td><input type="file"  required> </td>

        </tr>

        <tr>
            <td>
                <label for="Department">Department:</label>

                <select name="Department" id="Department">
                <option value="EEE">EEE</option>
                <option value="CSE">CSE</option>
                <option value="COE">COE</option>
                <option value="BBA">BBA</option>
                </select>

            </td>
        </tr>
        
            
       

        <tr>

            <td colspan="2"> <input type="submit"  class =" box1"> </td>

        </tr>



    </table>

   

</form>

 

</body>

</html>
