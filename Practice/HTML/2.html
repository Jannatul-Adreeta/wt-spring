<!DOCTYPE html>
<html>

    <head>
    <title>University Admission Form</title>
    </head>

    <body>

    <h1 align="center">University Admission Form</h1>

        <form>

        <fieldset>
        <legend>Personal Information</legend>

            <table>

                <tr>
                    <td><label for="fname">First Name:</label></td>
                    <td><input type="text" id="fname" placeholder="First Name" class="box" maxlength="10" required></td>
                </tr>

                <tr>
                    <td><label for="lname">Last Name:</label></td>
                    <td><input type="text" id="lname" placeholder="Last Name" class="box" maxlength="10" required></td>
                </tr>

                <tr>
                    <td><label for="dob">DOB:</label></td>
                    <td><input type="date" id="dob" class="box" required></td>
                </tr>

                <tr>
                    <td>Gender:</td>
                    <td>
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                    </td>
                </tr>

                <tr>
                    <td>Ethnicity: </td>
                    <td>
                        <input type="checkbox" id="bangladeshi" name="ethnicity" value="Bangladeshi">
                        <label for="bangladeshi">Bangladeshi</label>

                        <input type="checkbox" id="others" name="ethnicity" value="Others">
                        <label for="others">Others</label>
                    </td>
                </tr>

                <tr>
                    <td><label for="files">Upload File:</label></td>
                    <td><input type="file" id="files" required></td>
                </tr>

                    <tr>
                    <td><label for="dept">Department:</label></td>
                    <td>
                    <select id="dept">
                    <option value="EEE">EEE</option>
                    <option value="CSE">CSE</option>
                    <option value="IPE">IPE</option>
                    </select>
                    </td>
                </tr>

                    <tr>
                    <td><label for="phone">Phone Number:</label></td>
                    <td><input type="tel" id="phone" placeholder="Enter Phone number" maxlength="11" class="box"></td>
                    </tr>

                <tr>
                    <td><label for="pass">Password:</label></td>
                    <td><input type="password" id="pass" placeholder="Password" class="box" required></td>
                </tr>

                <tr>
                    <td><label for="cpass">Confirm Password:</label></td>
                    <td><input type="password" id="cpass" placeholder="Confirm Password" class="box" required></td>
                </tr>

                <tr>
                    <td colspan="2" style="text-align:center;">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
                    </td>
                </tr>

            </table>

        </fieldset>

        </form>

    </body>

</html>
